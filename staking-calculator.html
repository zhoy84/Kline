<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TRX 做空杠杆策略计算器</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:#0f0f1a;color:#d1d5db;padding:20px;font-size:14px}
h1{font-size:20px;font-weight:700;background:linear-gradient(90deg,#60a5fa,#a78bfa);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:16px}
.card{background:#1a1a2e;border:1px solid #1f2937;border-radius:8px;padding:16px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:6px}
.g2{flex:1;min-width:130px}
label{display:block;font-size:12px;color:#9ca3af;margin-bottom:3px}
input{width:100%;padding:7px 8px;border-radius:5px;border:1px solid #374151;background:#111827;color:#e5e7eb;font-size:13px;font-family:monospace}
input:focus{outline:none;border-color:#60a5fa}
.info{font-size:12px;color:#6b7280;display:flex;gap:16px;flex-wrap:wrap;padding:8px 0}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;padding:6px 5px;border-bottom:1px solid #374151;color:#9ca3af;font-weight:600;white-space:nowrap}
td{padding:5px;border-bottom:1px solid #1f2937;font-family:monospace;text-align:right;white-space:nowrap}
td.l{text-align:left;font-family:inherit}
.green{color:#34d399}
.red{color:#f87171}
.blue{color:#60a5fa}
.orange{color:#fb923c}
.highlight{background:rgba(96,165,250,0.08)}
</style>
</head>
<body>

<h1>📊 TRX 做空杠杆策略收益计算器</h1>

<div class="card">
  <div class="row">
    <div class="g2"><label>质押价格 $</label><input type="number" id="buyPrice" value="0.332" step="0.001"></div>
    <div class="g2"><label>开仓价格 $</label><input type="number" id="shortPrice" value="0.332" step="0.001"></div>
    <div class="g2"><label>质押数量 (TRX)</label><input type="number" id="stakeAmount" value="1649" step="1"></div>
    <div class="g2"><label>年化收益率 %</label><input type="number" id="apy" value="12.25" step="0.01"></div>
  </div>
  <div class="info">备用金 = 质押金额（全额对冲）</div>
</div>

<div class="card">
  <h2 style="font-size:15px;font-weight:600;color:#e5e7eb;margin-bottom:8px">📋 全部组合策略对比</h2>
  <div style="overflow-x:auto">
  <table>
    <thead>
      <tr>
        <th>排名</th>
        <th>策略</th>
        <th>轮数</th>
        <th>止于价格</th>
        <th>涨幅</th>
        <th>总资产</th>
        <th>净赚</th>
        <th>ROI</th>
        <th>每次操作</th>
      </tr>
    </thead>
    <tbody id="mainTable"></tbody>
  </table>
  </div>
</div>

<div class="card">
  <h2 style="font-size:15px;font-weight:600;color:#e5e7eb;margin-bottom:8px">🔍 选中策略明细</h2>
  <div style="margin-bottom:8px">
    <label style="font-size:13px;color:#d1d5db">选择策略：
    <select id="strategySelect" style="background:#111827;color:#e5e7eb;border:1px solid #374151;border-radius:4px;padding:4px 8px;font-size:13px;margin-left:8px"></select>
    </label>
  </div>
  <div style="overflow-x:auto">
  <table>
    <thead>
      <tr>
        <th>轮次</th>
        <th>杠杆</th>
        <th>开仓价</th>
        <th>爆仓价</th>
        <th>亏保证金</th>
        <th>剩余现金</th>
        <th>质押价值</th>
        <th>总资产</th>
        <th>此轮净赚</th>
      </tr>
    </thead>
    <tbody id="detailTable"></tbody>
  </table>
  </div>
</div>

<script>
function calc() {
  const n = parseFloat(document.getElementById('stakeAmount').value) || 1649;
  const p0 = parseFloat(document.getElementById('shortPrice').value) || 0.332;
  const buyPrice = parseFloat(document.getElementById('buyPrice').value) || 0.332;
  const apy = (parseFloat(document.getElementById('apy').value) || 12.25) / 100;
  const totalTRX = n + n * apy;
  const stakeVal = n * p0;
  const backup = n * buyPrice;  // 备用金 = 买入成本
  const initial = stakeVal + backup;

  function runStrategy(levs) {
    let cash = backup, price = p0, round = 0, steps = [];
    
    for (const lev of levs) {
      while (true) {
        round++;
        const pos = n * price;
        const margin = pos / lev;
        if (margin > cash + 0.005) {
          const sv = totalTRX * price;
          return { steps, finalPrice: price, cash, stakedVal: sv, 
                   totalAsset: sv + cash, profit: sv + cash - initial,
                   roi: ((sv + cash - initial) / initial) * 100 };
        }
        const liq = price * (1 + 1/lev);
        cash -= margin;
        const sv = totalTRX * liq;
        steps.push({ round, lev: lev + 'x', entry: price, liq, margin, cashAfter: cash, stakedVal: sv, 
                     total: sv + cash, profit: sv + cash - initial });
        price = liq;
        break;
      }
    }
    
    const lastLev = levs[levs.length-1];
    while (true) {
      round++;
      const pos = n * price;
      const margin = pos / lastLev;
      if (margin > cash + 0.005) break;
      const liq = price * (1 + 1/lastLev);
      cash -= margin;
      const sv = totalTRX * liq;
      steps.push({ round, lev: lastLev + 'x', entry: price, liq, margin, cashAfter: cash, stakedVal: sv,
                   total: sv + cash, profit: sv + cash - initial });
      price = liq;
    }
    
    const sv = totalTRX * price;
    return { steps, finalPrice: price, cash, stakedVal: sv,
             totalAsset: sv + cash, profit: sv + cash - initial,
             roi: ((sv + cash - initial) / initial) * 100 };
  }

  const combos = [
    [2], [3], [5], [10],
    [2,3], [2,5], [2,10], [3,2], [3,5], [3,10],
    [5,10], [5,2], [2,3,5], [2,5,10], [3,5,10], [2,3,5,10]
  ];
  
  const labels = {
    '2': '2x', '3': '3x', '5': '5x', '10': '10x',
    '2,3': '2→3x', '2,5': '2→5x', '2,10': '2→10x',
    '3,2': '3→2x', '3,5': '3→5x', '3,10': '3→10x',
    '5,10': '5→10x', '5,2': '5→2x',
    '2,3,5': '2→3→5x', '2,5,10': '2→5→10x',
    '3,5,10': '3→5→10x', '2,3,5,10': '2→3→5→10x'
  };

  const results = combos.map(c => ({ key: c.join(','), levs: c, result: runStrategy(c) }));
  results.sort((a, b) => b.result.roi - a.result.roi);

  // Main table
  let html = '';
  results.forEach((r, i) => {
    const res = r.result;
    const chg = ((res.finalPrice / p0) - 1) * 100;
    const ops = res.steps.length;
    const rowClass = i === 0 ? ' class="highlight"' : '';
    html += '<tr' + rowClass + '>';
    html += '<td class="l">#' + (i + 1) + '</td>';
    html += '<td class="l"><strong>' + labels[r.key] + '</strong></td>';
    html += '<td>' + ops + '次</td>';
    html += '<td>$' + res.finalPrice.toFixed(3) + '</td>';
    html += '<td class="green">+' + chg.toFixed(1) + '%</td>';
    html += '<td>$' + res.totalAsset.toFixed(2) + '</td>';
    html += '<td class="green">+$' + res.profit.toFixed(2) + '</td>';
    html += '<td class="green">' + res.roi.toFixed(2) + '%</td>';
    html += '<td>' + res.steps.map(s => s.lev).join('→') + '</td>';
    html += '</tr>';
  });
  document.getElementById('mainTable').innerHTML = html;

  // Strategy selector
  const sel = document.getElementById('strategySelect');
  sel.innerHTML = '';
  results.forEach(r => {
    const opt = document.createElement('option');
    opt.value = r.key;
    opt.textContent = labels[r.key] + ' (' + r.result.roi.toFixed(2) + '%)';
    sel.appendChild(opt);
  });

  // Detail of selected
  calcDetail();
}

document.getElementById('buyPrice').addEventListener('input', calc);
document.getElementById('shortPrice').addEventListener('input', calc);
document.getElementById('stakeAmount').addEventListener('input', calc);
document.getElementById('apy').addEventListener('input', calc);
document.getElementById('strategySelect').addEventListener('change', function() {
  calcDetail();
});

function calcDetail() {
  const n = parseFloat(document.getElementById('stakeAmount').value) || 1649;
  const p0 = parseFloat(document.getElementById('shortPrice').value) || 0.332;
  const buyPrice = parseFloat(document.getElementById('buyPrice').value) || 0.332;
  const apy = (parseFloat(document.getElementById('apy').value) || 12.25) / 100;
  const totalTRX = n + n * apy;
  const stakeVal = n * p0;
  const backup = n * buyPrice;
  const initial = stakeVal + backup;

  function run(levs) {
    let cash = backup, price = p0, round = 0, steps = [];
    for (const lev of levs) {
      while (true) {
        round++;
        const pos = n * price;
        const margin = pos / lev;
        if (margin > cash + 0.005) break;
        const liq = price * (1 + 1/lev);
        cash -= margin;
        const sv = totalTRX * liq;
        steps.push({ round, lev: lev + 'x', entry: price, liq, margin, cashAfter: cash, stakedVal: sv, total: sv + cash, profit: sv + cash - initial });
        price = liq;
        break;
      }
    }
    const lastLev = levs[levs.length-1];
    while (true) {
      round++;
      const pos = n * price;
      const margin = pos / lastLev;
      if (margin > cash + 0.005) break;
      const liq = price * (1 + 1/lastLev);
      cash -= margin;
      const sv = totalTRX * liq;
      steps.push({ round, lev: lastLev + 'x', entry: price, liq, margin, cashAfter: cash, stakedVal: sv, total: sv + cash, profit: sv + cash - initial });
      price = liq;
    }
    const sv = totalTRX * price;
    return { steps, finalPrice: price, cash, stakedVal: sv, totalAsset: sv + cash, profit: sv + cash - initial, roi: ((sv + cash - initial) / initial) * 100 };
  }

  const sel = document.getElementById('strategySelect').value;
  const levs = sel.split(',').map(Number);
  const res = run(levs);
  let html = '';
  for (const s of res.steps) {
    const chg = ((s.liq / p0) - 1) * 100;
    html += '<tr><td>' + s.round + '</td><td>' + s.lev + '</td><td>$' + s.entry.toFixed(3) + '</td><td>$' + s.liq.toFixed(3) + ' (+' + chg.toFixed(1) + '%)</td><td class="red">-$' + s.margin.toFixed(2) + '</td><td>$' + s.cashAfter.toFixed(2) + '</td><td>$' + s.stakedVal.toFixed(2) + '</td><td>$' + s.total.toFixed(2) + '</td><td class="green">+$' + s.profit.toFixed(2) + '</td></tr>';
  }
  html += '<tr class="highlight"><td colspan="9" style="text-align:center;color:#fb923c">❌ 现金耗尽，终局 $' + res.finalPrice.toFixed(3) + '（+' + (((res.finalPrice/p0)-1)*100).toFixed(1) + '%），净赚 +$' + res.profit.toFixed(2) + '，ROI ' + res.roi.toFixed(2) + '%</td></tr>';
  document.getElementById('detailTable').innerHTML = html;
}



calc();
</script>

</body>
</html>
